name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality and production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@10.9.8

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository checks and production builds
        run: npm run check

  integration:
    name: Empty PostgreSQL migration and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@10.9.8

      - name: Install locked dependencies
        run: npm ci

      - name: Start isolated local infrastructure
        run: npm run db:up

      - name: Run real PostgreSQL and Worker integration tests
        run: npm run test:integration

      - name: Stop isolated local infrastructure
        if: always()
        run: npm run db:down

  security:
    name: Secrets and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete Git history for secrets
        run: >-
          docker run --rm
          --env GIT_CONFIG_COUNT=1
          --env GIT_CONFIG_KEY_0=safe.directory
          --env GIT_CONFIG_VALUE_0=/repo
          --volume "${GITHUB_WORKSPACE}:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --log-opts="--all"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@10.9.8

      - name: Enforce reviewed dependency-audit policy
        run: npm run audit:dependencies

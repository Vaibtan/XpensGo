name: Managed PostgreSQL migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: Neon project to migrate
        required: true
        type: choice
        options:
          - development
          - staging

permissions:
  contents: read

concurrency:
  group: managed-migrations-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@10.9.8

      - name: Install locked dependencies
        run: npm ci

      - name: Select development migration authority
        if: inputs.target == 'development'
        env:
          SELECTED_DATABASE_URL: ${{ secrets.XPENSEGO_MIGRATION_DATABASE_URL_DEVELOPMENT }}
        run: |
          test -n "$SELECTED_DATABASE_URL"
          echo "XPENSEGO_MIGRATION_DATABASE_URL=$SELECTED_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Select staging migration authority
        if: inputs.target == 'staging'
        env:
          SELECTED_DATABASE_URL: ${{ secrets.XPENSEGO_MIGRATION_DATABASE_URL_STAGING }}
        run: |
          test -n "$SELECTED_DATABASE_URL"
          echo "XPENSEGO_MIGRATION_DATABASE_URL=$SELECTED_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Apply forward-only migrations
        run: npm run db:migrate

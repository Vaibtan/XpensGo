name: Model gateway staging proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-gateway-staging-proof
  cancel-in-progress: false

jobs:
  prove:
    name: Prove synthetic structured extraction
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@10.9.8

      - name: Install locked dependencies
        run: npm ci

      - name: Apply forward-only migrations
        env:
          XPENSEGO_MIGRATION_DATABASE_URL: ${{ secrets.XPENSEGO_MIGRATION_DATABASE_URL_STAGING }}
        run: npm run db:migrate

      - name: Run synthetic model acceptance
        env:
          XPENSEGO_EXPECTED_REVISION: ${{ github.sha }}
          XPENSEGO_MIGRATION_DATABASE_URL: ${{ secrets.XPENSEGO_MIGRATION_DATABASE_URL_STAGING }}
          XPENSEGO_PHASE1_PROBE_SECRET: ${{ secrets.XPENSEGO_PHASE1_PROBE_SECRET }}
          XPENSEGO_STAGING_API_URL: https://xpensego-api-staging.vaibhav21296.workers.dev
        run: npm run proof:model:staging --workspace=@xpensego/api

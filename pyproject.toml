[project]
name = "xpensego"
version = "0.1.0"
description = "Telegram-native expense agent for Indian consumers"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "openai>=1.0,<3",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot>=21,<23",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

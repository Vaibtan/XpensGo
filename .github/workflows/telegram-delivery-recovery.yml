name: Recover Telegram delivery

on:
  workflow_dispatch:
    inputs:
      outbound_message_id:
        description: Terminal outbound Telegram message UUID
        required: true
        type: string
      expected_error_code:
        description: Exact current terminal error code
        required: true
        default: telegram_http_400
        type: string
      reason:
        description: Reviewed reason the original rejection is now recoverable
        required: true
        type: choice
        options:
          - recipient_state_corrected
          - provider_configuration_corrected
      confirmation:
        description: Type recover to authorize one bounded provider retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-delivery-recovery-${{ inputs.outbound_message_id }}
  cancel-in-progress: false

jobs:
  recover:
    name: Recover terminal Telegram delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@10.9.8

      - name: Install locked dependencies
        run: npm ci

      - name: Requeue one reviewed Telegram delivery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.XPENSEGO_CLOUDFLARE_QUEUE_API_TOKEN_STAGING }}
          XPENSEGO_CLOUDFLARE_ACCOUNT_ID: 8f74ed3dc133e7662ff6889883764bc0
          XPENSEGO_CLOUDFLARE_QUEUE_ID: 27a57f577c5f4263addcf0b514b9fbdd
          XPENSEGO_MIGRATION_DATABASE_URL: ${{ secrets.XPENSEGO_MIGRATION_DATABASE_URL_STAGING }}
          XPENSEGO_TELEGRAM_EXPECTED_ERROR_CODE: ${{ inputs.expected_error_code }}
          XPENSEGO_TELEGRAM_OUTBOUND_MESSAGE_ID: ${{ inputs.outbound_message_id }}
          XPENSEGO_TELEGRAM_RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
          XPENSEGO_TELEGRAM_RECOVERY_ID: github-run-${{ github.run_id }}
          XPENSEGO_TELEGRAM_RECOVERY_REASON: ${{ inputs.reason }}
        run: npm run operator:telegram:recover --workspace=@xpensego/api
